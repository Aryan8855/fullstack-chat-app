name: Chat App CI/CD

on:
push:
branches:
- master

jobs:
build-push-deploy:
runs-on: ubuntu-latest


steps:
  - name: Checkout Code
    uses: actions/checkout@v4

  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build Frontend Image
    run: docker build -t chatapp-frontend ./frontend

  - name: Tag Frontend Image
    run: docker tag chatapp-frontend:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatapp-frontend:latest

  - name: Push Frontend Image
    run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatapp-frontend:latest

  - name: Build Backend Image
    run: docker build -t chatapp-backend ./backend

  - name: Tag Backend Image
    run: docker tag chatapp-backend:latest ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatapp-backend:latest

  - name: Push Backend Image
    run: docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/chatapp-backend:latest

  - name: Update Kubeconfig
    run: aws eks update-kubeconfig --region ${{ secrets.AWS_REGION }} --name chatapp-prod

  - name: Restart Backend Deployment
    run: kubectl rollout restart deployment/backend

  - name: Restart Frontend Deployment
    run: kubectl rollout restart deployment/frontend

  - name: Wait For Rollout
    run: |
      kubectl rollout status deployment/backend
      kubectl rollout status deployment/frontend

