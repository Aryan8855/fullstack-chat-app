apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: 757905896588.dkr.ecr.ap-south-1.amazonaws.com/chatapp-backend:v1

        imagePullPolicy: Always

        ports:
        - containerPort: 5001

        env:
        - name: PORT
          value: "5001"

        # Add your Mongo URI and JWT secret later